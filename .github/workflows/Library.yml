# The compiled library of the benchmark instances (cnlp ABI, CPU and CUDA), built and checked on
# every change. Pushes to main publish it as the rolling `nightly` release; a version tag
# (TagBot, on registration) attaches it to that release. Installed with
# `cnlp install mittelmann` or `cnlp install mittelmann@nightly` (https://cnlplib.madsuite.org).
name: Library

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  library:
    uses: madsuite-org/cnlplib/.github/workflows/library.yml@puma/chunked
    with:
      name: mittelmann
      chunks: "9"
      cnlplib-ref: puma/chunked   # until madsuite-org/cnlplib#12 is merged
    permissions:
      contents: write
